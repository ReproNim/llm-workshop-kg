# TEMPLATE ONLY (not installed). Appends one dated activity snapshot per resource every Monday.
# Copy to .github/workflows/ in a repository that holds this experiment.
name: refresh-resource-activity
on:
  schedule: [{cron: "17 6 * * 1"}]
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python code/refresh_activity.py --min-interval-minutes 1440
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - run: |
          git config user.name "activity-bot"; git config user.email "activity-bot@users.noreply.github.com"
          git add graph/resource_activity.ttl results/resource_activity_log.jsonl
          git commit -m "Append resource activity snapshot" || echo "nothing new"
          git push
